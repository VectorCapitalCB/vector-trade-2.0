# Feed ITCH en vivo (172.16.0.7) escribiendo al Mongo de QA. Puebla el dia en curso.
# La variacion del dia se calcula contra el cierre oficial del dia habil anterior, que
# findPreviousClose ahora toma de instrument_daily (poblado desde los logs FIX).
mkd.source=itch
mkd.itch.host=172.16.0.7
mkd.itch.port=9095
mkd.itch.exchange=BCS
mkd.itch.currency=CLP
mkd.itch.log.path=./logs/itch-mkd
# El consumidor hace broadcast de trades: suscribirse serian ~50.000 mensajes al pedo.
mkd.itch.subscribe=false
fix.process.snapshot.trades=false

mongo.uri=mongodb://admin:Avn.Mongo.2026@172.16.0.8:27017/?authSource=admin
mongo.database=inyectorcandle
mongo.write.queue.size=200000
mongo.write.batch.size=500
mongo.write.flush.ms=200
stats.throttle.ms=500
candles.open.flush.ms=1000

candles.timeframes=PT1M,PT5M,PT15M,PT30M,PT1H,PT4H,P1D
rankings.interval=PT30S

# stats.market define contra que mercado busca el cierre previo en instrument_daily.
stats.market=BCS
stats.currency=CLP
stats.zone=America/Santiago
stats.session.open=09:30
stats.session.close=16:00
# Cada cuanto se publica el dia en curso en instrument_daily + bolsa_stats_history.
stats.live.interval=PT60S

replay.enabled=false
stats.replay.enabled=false
itch.replay.enabled=false
alpaca.enabled=false
fix.config.file=src/main/resources/fix/bcs-initiator.cfg
