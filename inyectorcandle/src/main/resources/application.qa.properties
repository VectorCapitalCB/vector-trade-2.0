# QA (172.16.0.8) con market data de PRODUCCION.
# Uso: java -jar inyectorcandle-fat.jar /usr/local/app/config/application.qa.properties

# --- Origen de market data -------------------------------------------------
# itch = consumidor ITCH NUAM por protobuf/TCP (mismo transporte que el OMS)
# fix  = sesion FIX contra BCS (requiere fix.config.file)
mkd.source=itch
mkd.itch.host=172.16.0.7
mkd.itch.port=9095
mkd.itch.exchange=BCS
mkd.itch.currency=CLP
mkd.itch.log.path=/usr/local/app/logs/itch-mkd
# El consumidor ITCH hace broadcast de trades a todo cliente conectado (validado 2026-08-06:
# 19 trades en 20 s sin enviar una sola suscripcion). Poner en true solo si el feed deja de
# publicar por si solo: son ~16.700 simbolos x 3 settlements = ~50.000 mensajes de Subscribe.
mkd.itch.subscribe=false
fix.process.snapshot.trades=false

# --- Mongo (contenedor mongo-avn en el host de QA) -------------------------
# Password del contenedor mongo-avn (validada 2026-08-06). authSource=admin es obligatorio.
mongo.uri=mongodb://admin:Avn.Mongo.2026@172.16.0.8:27017/?authSource=admin
mongo.database=inyectorcandle

# --- Escritura asincrona ---------------------------------------------------
# El feed solo encola; un hilo agrupa por coleccion y escribe con bulkWrite no ordenado.
mongo.write.queue.size=200000
mongo.write.batch.size=500
mongo.write.flush.ms=200
# Snapshot de instrument_stats como maximo cada N ms por instrumento (antes era 1 por tick).
stats.throttle.ms=500
# Vela en curso: se persiste al cerrar bucket y ademas cada N ms para que el front la vea viva.
candles.open.flush.ms=1000

candles.timeframes=PT1M,PT5M,PT15M,PT30M,PT1H,PT4H,P1D
rankings.interval=PT30S

replay.enabled=false

# --- Alpaca (barras nativas, no se agregan trades) -------------------------
# Claves validadas 2026-08-06: sip habilitado (feed consolidado, no el gratuito iex).
alpaca.enabled=true
alpaca.key.id=CKL3K6I3VQ74YBCZVZMYYC5KPA
alpaca.secret.key=6t4NjG1rTJb99AoFaAn7ay8cwaT1y48GVDSEVZwJGgFZ
# sip = consolidado (habilitado en esta cuenta), iex = gratuito
alpaca.feed=sip
# El REST de bars exige simbolos explicitos (no admite wildcard). Completar con los que se sigan.
alpaca.symbols=AAPL,MSFT,TSLA,NVDA,AMZN,SPY,QQQ
alpaca.data.url=https://data.alpaca.markets
alpaca.stream.url=wss://stream.data.alpaca.markets/v2
alpaca.backfill.days=5
alpaca.poll.seconds=60
