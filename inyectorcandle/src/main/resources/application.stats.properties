# Inyeccion de estadistica oficial desde logs de mensajes FIX (35=W) hacia el Mongo de QA.
# Uso: mvn exec:java -Dexec.args=src/main/resources/application.stats.properties
#
# market/currency son parametros: el mismo binario sirve para BCS, NUAM o cualquier otra plaza.
# FIX primero: su OHLCV es el oficial. ITCH despues, que complementa sin pisar.
stats.replay.enabled=true
stats.replay.input.path=D:/ITCH-DATA/fix-logs

itch.replay.enabled=true
itch.replay.input.path=D:/ITCH-DATA

stats.market=BCS
stats.currency=CLP
stats.zone=America/Santiago
stats.session.open=09:30
stats.session.close=16:00

mongo.uri=mongodb://admin:Avn.Mongo.2026@172.16.0.8:27017/?authSource=admin
mongo.database=inyectorcandle

# No se usan en este modo, pero AppConfig los exige.
fix.config.file=src/main/resources/fix/bcs-initiator.cfg
replay.enabled=false
