# Replay historico de velas desde los logs ITCH. No escribe estadistica diaria ni close_prices.
stats.replay.enabled=false
itch.replay.enabled=true
itch.replay.input.path=/data/logs
itch.replay.write.daily=false

stats.market=BCS
stats.currency=CLP
stats.zone=America/Santiago
stats.session.open=09:05
stats.session.close=17:00

# 1D conserva su fuente oficial; el replay completa solamente las temporalidades intradia.
candles.timeframes=PT1M,PT5M,PT15M,PT30M,PT1H,PT4H

mongo.uri=mongodb://USER:PASSWORD@MONGO_HOST:27017/?authSource=admin
mongo.database=inyectorcandle
mongo.write.queue.size=200000
mongo.write.batch.size=1000
mongo.write.flush.ms=100

fix.config.file=src/main/resources/fix/bcs-initiator.cfg
replay.enabled=false
