name: release-windows-signed

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version de produccion (X.Y.Z)"
        required: true
        type: string
      publish:
        description: "Publicar en el feed interno y habilitar el auto-update"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vectortrade-production-release
  cancel-in-progress: false

env:
  APP_ID: VectorTrade
  APP_TITLE: Vector Trade 2.0
  EXE_NAME: VectorTrade.exe
  FRONT_DIR: vector-trade-front
  RELEASES: vector-trade-front/target/velopack/releases
  STAGE: vector-trade-front/target/velopack/stage
  FEED_URL: http://172.16.0.6:8092/updatevtautoupdate
  VPK_VERSION: 1.2.0
  CODESIGNTOOL_VERSION: 1.3.3
  CODESIGNTOOL_URL: https://ssl.com/download/codesigntool-for-windows/
  CODESIGNTOOL_SHA256: 317d429be3aa12a5f2c1ffdd575eab0cb0ce5e2408ab0056bcdcaab29875f73d

jobs:
  build-sign:
    name: Compilar y firmar v${{ inputs.version }}
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar release y estampar configuracion
        id: release
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}".Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version invalida: '$version'. Se espera X.Y.Z."
          }

          $properties = Join-Path $env:FRONT_DIR 'src/main/resources/blotter/enviroment/application.production.properties'
          $content = Get-Content -LiteralPath $properties -Raw
          $content = [regex]::Replace($content, '(?m)^version=.*$', "version=$version")
          $content = [regex]::Replace($content, '(?m)^url=.*$', "url=$env:FEED_URL")
          $content = [regex]::Replace($content, '(?m)^application=.*$', "application=$env:APP_ID")
          Set-Content -LiteralPath $properties -Value $content -NoNewline -Encoding utf8

          $main = Get-Content -LiteralPath (Join-Path $env:FRONT_DIR 'src/main/java/cl/vc/blotter/MainApp.java') -Raw
          if (!$main.Contains('/blotter/enviroment/application.production.properties')) {
            throw 'MainApp no carga application.production.properties.'
          }
          if (!$content.Contains("version=$version") -or !$content.Contains("url=$env:FEED_URL") -or !$content.Contains("application=$env:APP_ID")) {
            throw 'No se pudo estampar la identidad completa del release.'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validar secretos SSL.com
        shell: pwsh
        env:
          SSL_USERNAME: ${{ secrets.SSL_USERNAME }}
          SSL_PASSWORD: ${{ secrets.SSL_PASSWORD }}
          SSL_TOTP_SECRET: ${{ secrets.SSL_TOTP_SECRET }}
          SSL_CREDENTIAL_ID: ${{ secrets.SSL_CREDENTIAL_ID }}
        run: |
          $required = @{
            SSL_USERNAME = $env:SSL_USERNAME
            SSL_PASSWORD = $env:SSL_PASSWORD
            SSL_TOTP_SECRET = $env:SSL_TOTP_SECRET
            SSL_CREDENTIAL_ID = $env:SSL_CREDENTIAL_ID
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object { $_.Key })
          if ($missing.Count -gt 0) { throw "Faltan secretos SSL.com: $($missing -join ', ')" }
          Write-Host 'Secretos SSL.com disponibles; sus valores no se imprimen.'

      - name: Instalar y validar CodeSignTool
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "CodeSignTool-$env:CODESIGNTOOL_VERSION.zip"
          $toolHome = Join-Path $env:RUNNER_TEMP "CodeSignTool-$env:CODESIGNTOOL_VERSION"
          Invoke-WebRequest -Uri $env:CODESIGNTOOL_URL -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:CODESIGNTOOL_SHA256) {
            throw "Hash inesperado de CodeSignTool: $actual"
          }
          New-Item -ItemType Directory -Path $toolHome -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $toolHome -Force
          if (!(Test-Path -LiteralPath (Join-Path $toolHome 'conf/code_sign_tool.properties'))) {
            throw 'CodeSignTool no contiene su configuracion oficial.'
          }
          "CODESIGNTOOL_HOME=$toolHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Preparar GraalVM de Gluon
        uses: gluonhq/setup-graalvm@3a9b11a45ef0ecad69107f5884b5dbbb7b806e1c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          graalvm: 23+25.1-dev-2409082136
          jdk: java23
          arch: x86_64

      - name: Preparar MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compilar e instalar principal-module
        shell: pwsh
        run: mvn -B -f principal-module/pom.xml -DskipTests install

      - name: Ejecutar pruebas del front
        shell: pwsh
        run: mvn -B -f "$env:FRONT_DIR/pom.xml" test

      - name: Compilar ejecutable nativo de produccion
        shell: pwsh
        run: mvn -B -f "$env:FRONT_DIR/pom.xml" -Pwindows gluonfx:build

      - name: Preparar ejecutable
        shell: pwsh
        run: |
          $source = Join-Path $env:FRONT_DIR "target/gluonfx/x86_64-windows/$env:EXE_NAME"
          if (!(Test-Path -LiteralPath $source -PathType Leaf)) { throw "Gluon no genero $source" }
          Remove-Item -LiteralPath $env:STAGE -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $env:RELEASES -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $env:STAGE -Force | Out-Null
          New-Item -ItemType Directory -Path $env:RELEASES -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path $env:STAGE $env:EXE_NAME) -Force

      - name: Instalar Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version $env:VPK_VERSION
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Empaquetar y firmar app, updater e instalador
        shell: pwsh
        env:
          SSL_USERNAME: ${{ secrets.SSL_USERNAME }}
          SSL_PASSWORD: ${{ secrets.SSL_PASSWORD }}
          SSL_TOTP_SECRET: ${{ secrets.SSL_TOTP_SECRET }}
          SSL_CREDENTIAL_ID: ${{ secrets.SSL_CREDENTIAL_ID }}
        run: |
          $vpk = Join-Path $env:USERPROFILE '.dotnet/tools/vpk.exe'
          $signScript = Join-Path $env:GITHUB_WORKSPACE "$env:FRONT_DIR/installer/windows/sign-file.cmd"
          $signTemplate = "`"$signScript`" {{file}}"
          & $vpk pack `
            --packId $env:APP_ID `
            --packTitle "$env:APP_TITLE" `
            --packVersion "${{ steps.release.outputs.version }}" `
            --packDir $env:STAGE `
            --mainExe $env:EXE_NAME `
            --icon (Join-Path $env:FRONT_DIR 'src/windows/assets/icon.ico') `
            --shortcuts 'Desktop,StartMenuRoot' `
            --outputDir $env:RELEASES `
            --signTemplate $signTemplate
          if ($LASTEXITCODE -ne 0) { throw "Velopack termino con codigo $LASTEXITCODE" }

      - name: Verificar firma, firmante y timestamp
        shell: pwsh
        run: |
          $version = '${{ steps.release.outputs.version }}'
          $full = Get-ChildItem -Path $env:RELEASES -Filter "*-$version-full.nupkg" -File | Select-Object -First 1
          if ($null -eq $full) { throw "Falta el paquete full de $version" }
          $verify = Join-Path $env:RUNNER_TEMP "verify-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $verify | Out-Null
          try {
            [System.IO.Compression.ZipFile]::ExtractToDirectory($full.FullName, $verify)
            $executables = @(
              Get-ChildItem -Path $env:RELEASES -Filter *.exe -File
              Get-ChildItem -Path $verify -Filter *.exe -File -Recurse
            ) | Sort-Object FullName -Unique
            if ($executables.Count -eq 0) { throw 'No hay ejecutables para validar.' }
            foreach ($exe in $executables) {
              $signature = Get-AuthenticodeSignature -LiteralPath $exe.FullName
              if ($signature.Status -ne 'Valid') { throw "Firma invalida en $($exe.Name): $($signature.Status)" }
              if ($signature.SignerCertificate.Subject -notlike '*Vector Capital Corredores De Bolsa Spa*') {
                throw "Firmante inesperado en $($exe.Name): $($signature.SignerCertificate.Subject)"
              }
              if ($null -eq $signature.TimeStamperCertificate) { throw "$($exe.Name) no tiene timestamp" }
              Write-Host "$($exe.Name): firma y timestamp validos"
            }
          } finally {
            Remove-Item -LiteralPath $verify -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Generar manifiesto SHA-256
        shell: pwsh
        run: |
          $manifest = Join-Path $env:RELEASES 'SHA256SUMS.txt'
          Get-ChildItem -Path $env:RELEASES -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -LiteralPath $manifest -Encoding ascii

      - name: Subir release firmado
        uses: actions/upload-artifact@v4
        with:
          name: VectorTrade-signed-${{ steps.release.outputs.version }}
          path: ${{ env.RELEASES }}/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publicar v${{ needs.build-sign.outputs.version }}
    if: ${{ inputs.publish == true }}
    needs: build-sign
    runs-on: [self-hosted, windows, gluon]
    timeout-minutes: 30

    steps:
      - name: Descargar release firmado
        uses: actions/download-artifact@v4
        with:
          name: VectorTrade-signed-${{ needs.build-sign.outputs.version }}
          path: feed-stage

      - name: Validar acceso de publicacion
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          $required = @{
            DEPLOY_HOST = $env:DEPLOY_HOST
            DEPLOY_USER = $env:DEPLOY_USER
            DEPLOY_SSH_KEY = $env:DEPLOY_SSH_KEY
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object { $_.Key })
          if ($missing.Count -gt 0) {
            throw "Faltan secretos de despliegue: $($missing -join ', ')."
          }
          if ($env:DEPLOY_HOST.Trim() -ne '172.16.0.6') {
            throw 'DEPLOY_HOST debe ser 172.16.0.6. Se rechazo la publicacion para proteger otros servidores.'
          }

      - name: Publicar de forma atomica
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          $version = '${{ needs.build-sign.outputs.version }}'
          $key = Join-Path $env:RUNNER_TEMP 'vt2_feed_key'
          $target = "$($env:DEPLOY_USER)@$($env:DEPLOY_HOST)"
          $remoteRoot = '/home/voultech/app/VectorTrade2.0/updatefeed'
          $incoming = "$remoteRoot/.incoming-$version"
          try {
            $env:DEPLOY_SSH_KEY | Set-Content -NoNewline -LiteralPath $key -Encoding ascii
            icacls $key /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null
            $opts = @('-i', $key, '-o', 'StrictHostKeyChecking=accept-new', '-o', 'ConnectTimeout=15')
            & ssh @opts $target "rm -rf '$incoming' && mkdir -p '$incoming'"
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo preparar incoming.' }
            $files = Get-ChildItem -LiteralPath 'feed-stage' -File
            if ($files.Count -eq 0) { throw 'El release no contiene archivos para publicar.' }
            foreach ($file in $files) {
              & scp @opts $file.FullName "${target}:$incoming/"
              if ($LASTEXITCODE -ne 0) {
                throw "No se pudo subir $($file.Name)."
              }
            }
            & ssh @opts $target "FEED_ROOT='$remoteRoot/releases' BACKUP_DIR='$remoteRoot/backups' bash '$remoteRoot/publish-feed.sh' --src '$incoming' && rm -rf '$incoming'"
            if ($LASTEXITCODE -ne 0) { throw 'La publicacion atomica fallo.' }
          } finally {
            Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue
          }

      - name: Verificar feed y portal
        shell: pwsh
        run: |
          $version = '${{ needs.build-sign.outputs.version }}'
          $feed = Invoke-WebRequest -Uri "$env:FEED_URL/releases.win.json" -MaximumRedirection 0 -TimeoutSec 20 -UseBasicParsing
          $newest = ($feed.Content | ConvertFrom-Json).Assets |
            Where-Object { "$($_.Type)".ToLowerInvariant() -eq 'full' } |
            Sort-Object { [version]$_.Version } | Select-Object -Last 1
          if ($newest.Version -ne $version) { throw "El feed ofrece $($newest.Version), se esperaba $version" }
          $portal = Invoke-WebRequest -Uri 'http://172.16.0.6:8092/' -TimeoutSec 15 -UseBasicParsing
          if ($portal.StatusCode -ne 200) { throw "Portal HTTP $($portal.StatusCode)" }
          Write-Host "Release $version publicado y verificado."
