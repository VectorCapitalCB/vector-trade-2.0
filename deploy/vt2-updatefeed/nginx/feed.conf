# =============================================================================
#  feed.conf  -  nginx que sirve el feed de auto-update de VectorTrade
#
#  Contrato con el cliente (cl.vc.blotter.utils.VelopackUpdater):
#    1. GET {url}/releases.win.json  -> DEBE responder 200 con JSON {"Assets":[...]}
#    2. GET {url}/{FileName}         -> DEBE responder 200 con el .nupkg
#
#  Restricciones que vienen del cliente, no las cambies sin leer el updater:
#
#  * httpGet() usa HttpURLConnection y valida `getResponseCode() != 200`.
#    HttpURLConnection NO sigue redirecciones entre http y https. Un 301 aca
#    hace que el updater registre "no se pudo leer feed" y siga de largo: el
#    usuario nunca ve la actualizacion y no hay error visible. Por eso este
#    server sirve el contenido DIRECTO, sin ningun return 301.
#
#  * El timeout de lectura del JSON es 5 s y el del .nupkg 120 s. Si el paquete
#    full es grande y el enlace lento, la descarga se aborta. Mantener los
#    paquetes livianos o subir esos timeouts en el cliente.
#
#  * El updater solo considera assets con Type == "Full". Los delta que genera
#    `vpk pack` se sirven igual (no molestan) pero hoy nadie los consume.
#
#  SEGURIDAD - LEER ANTES DE AMPLIAR EL PILOTO
#  -------------------------------------------
#  Este feed se sirve por HTTP PLANO en la red interna. El cliente valida el
#  SHA256 del paquete contra el indice, pero el indice tambien viaja en claro:
#  quien pueda interceptar el trafico controla el hash Y el paquete. Velopack no
#  valida la firma Authenticode al aplicar la actualizacion, asi que la firma de
#  SSL.com NO cubre este hueco.
#  -> Canal de actualizacion suplantable desde la red interna.
#  Mitigacion mientras sea un piloto: allowlist.inc restringe el acceso a las IP
#  autorizadas. Antes de ampliarlo a toda la mesa, hay que poner TLS y que Riesgo
#  acepte el riesgo residual de forma explicita.
# =============================================================================

server {
    listen      80 default_server;
    server_name _;

    # El portal vive en /srv/site y el feed en /srv/feed. Se mantienen como bind
    # mounts separados y de solo lectura para que Docker no intente anidar un
    # mount dentro de otro mount read-only.
    root /srv/site;

    server_tokens off;

    # A stdout/stderr, no a archivos: el contenedor corre con read_only=true y
    # asi los logs quedan visibles en `docker logs` y en Portainer.
    access_log /dev/stdout;
    error_log  stderr warn;

    # Sonda del healthcheck del contenedor. No la consume la app.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- portal interno -------------------------------------------------------
    location = / {
        include /etc/nginx/conf.d/allowlist.inc;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /index.html {
        include /etc/nginx/conf.d/allowlist.inc;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # --- indice del feed -------------------------------------------------------
    # Sin cache: si un proxy intermedio guarda releases.win.json, los clientes
    # siguen viendo la version vieja aunque el paquete nuevo ya este publicado.
    # (Las regex se evaluan antes que los prefijos, asi que esta gana sobre la
    #  location /updatevtautoupdate/ de mas abajo.)
    location ~ ^/updatevtautoupdate/releases\.[a-z0-9]+\.json$ {
        # OJO: las regex se evaluan ANTES que la location por prefijo, asi que la
        # allowlist tiene que repetirse en cada bloque. Si falta aca, el indice
        # queda accesible para toda la red aunque el prefijo este restringido.
        include /etc/nginx/conf.d/allowlist.inc;
        default_type application/json;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        alias /srv/feed/releases.win.json;
    }

    location = /updatevtautoupdate/downloads.json {
        include /etc/nginx/conf.d/allowlist.inc;
        default_type application/json;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        alias /srv/feed/downloads.json;
    }

    # --- paquetes e instaladores ----------------------------------------------
    # Inmutables: el nombre del archivo lleva la version, nunca se reescribe el
    # mismo nombre con otro contenido. Cache largo sin riesgo.
    location ~ ^/updatevtautoupdate/(?<asset_path>.+\.(nupkg|exe|msi|zip|dmg|pkg))$ {
        include /etc/nginx/conf.d/allowlist.inc;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        alias /srv/feed/$asset_path;
    }

    # --- resto del feed (SHA256SUMS.txt, etc.) --------------------------------
    location ~ ^/updatevtautoupdate/(?<feed_path>.+)$ {
        include /etc/nginx/conf.d/allowlist.inc;
        autoindex off;                # no exponer el listado del directorio
        alias /srv/feed/$feed_path;
    }

    # Nada mas se sirve desde este server.
    location ~ ^/(?!updatevtautoupdate/).+ {
        return 404;
    }
}
