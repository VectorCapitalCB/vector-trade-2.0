# QA (172.16.0.8). Uso: java -jar vector-candle-service.jar /usr/local/app/config/application.qa.properties
candle.websocket.port=8098
candle.websocket.path=/ws/
candle.server.host=0.0.0.0

# Password del contenedor mongo-avn (validada 2026-08-06). authSource=admin es obligatorio.
mongo.candle.uri=mongodb://admin:Avn.Mongo.2026@172.16.0.8:27017/?authSource=admin
mongo.candle.database=inyectorcandle
mongo.candle.collection=candles
mongo.candle.field.symbol=symbol
mongo.candle.field.timeframe=timeframe
mongo.candle.poll.ms=1000
mongo.candle.batch.size=300
mongo.candle.bootstrap.limit=200
# Estadistica oficial de la bolsa por instrumento/dia (accion load_instrument_daily, sin polling)
mongo.daily.collection=instrument_daily

# Historico diario para la ventana de velas. Solo lectura, consulta bajo demanda.
mongo.close.uri=mongodb://admin:10wfyaxqxk2hq@172.16.0.7:27017/close_prices?authSource=admin
mongo.close.database=close_prices
mongo.close.collection=close_prices

# Publicador protobuf (TradeGeneral + BolsaStats) hacia front por canal candle
mongo.market.poll.ms=2000
# Trades siguen en 2 s; el agregado completo del dia se recalcula una vez por minuto.
mongo.market.stats.poll.ms=30000
mongo.market.bootstrap.trades=300
mongo.market.bootstrap.days=1
mongo.market.bootstrap.max.trades=300000
mongo.market.trade.batch=300
mongo.market.stats.topn=20
mongo.market.exclude.symbols=TEST-STGOX
mongo.market.history.collection=bolsa_stats_history
mongo.market.history.days=30
# Serie intradia por instrumento (accion load_intraday_series, on-demand). 5 min => ~78 puntos por sesion.
mongo.market.intraday.bucket.minutes=5
